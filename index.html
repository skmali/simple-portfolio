<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Under Construction &middot; Shravan Mali</title>
  <meta name="description" content="This site is currently under construction. Shravan Mali - Application Architect. Check back soon." />
  <meta property="og:title" content="Under Construction - Shravan Mali" />
  <meta property="og:description" content="Something new is being built. Check back soon." />
  <meta property="og:type" content="website" />

  <style>
    :root {
      --bg: #0b1020;
      --bg2: #101935;
      --bg3: #1a1040;
      --surface: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.12);
      --content: #e6ebff;
      --muted: #9aa6c7;
      --accent: #6ea8ff;
      --accent2: #a06bff;
      --accent-contrast: #06102a;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--content);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      background: linear-gradient(-45deg, var(--bg), var(--bg2), var(--bg3), var(--bg));
      background-size: 400% 400%;
      animation: gradientShift 18s ease infinite;
    }

    @keyframes gradientShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Twinkling starfield */
    .stars, .stars::after {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 20px 30px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 120px 80px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1.5px 1.5px at 200px 150px, rgba(174,196,255,0.9), transparent),
        radial-gradient(1px 1px at 300px 60px, rgba(255,255,255,0.7), transparent),
        radial-gradient(1.5px 1.5px at 380px 200px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 460px 120px, rgba(200,180,255,0.8), transparent);
      background-repeat: repeat;
      background-size: 500px 300px;
      animation: twinkle 4s ease-in-out infinite alternate;
    }
    .stars::after {
      content: "";
      background-size: 400px 260px;
      opacity: 0.5;
      animation-duration: 6s;
      animation-delay: -2s;
    }

    @keyframes twinkle {
      from { opacity: 0.35; }
      to   { opacity: 0.9; }
    }

    .card {
      position: relative;
      z-index: 2;
      width: min(92vw, 640px);
      padding: 3rem 2rem;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
      animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Logo + orbit */
    .orbit {
      position: relative;
      width: 180px;
      height: 180px;
      margin: 0 auto 1.75rem;
    }

    .glow-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent), var(--accent2), var(--accent));
      filter: blur(4px);
      animation: spin 6s linear infinite;
      opacity: 0.8;
    }

    .glow-ring::after {
      content: "";
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      background: var(--bg);
    }

    .avatar {
      position: absolute;
      inset: 16px;
      width: calc(100% - 32px);
      height: calc(100% - 32px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      background: radial-gradient(circle at 50% 40%, rgba(110,168,255,0.15), var(--bg));
      box-shadow: 0 0 30px rgba(110, 168, 255, 0.4);
      animation: float 5s ease-in-out infinite;
    }

    .avatar svg {
      width: 52%;
      height: 52%;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-10px); }
    }

    /* Orbiting dots */
    .orbit-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      margin: -50% 0 0 -50%;
      animation: spin 9s linear infinite;
    }
    .orbit-dot.reverse { animation-duration: 13s; animation-direction: reverse; }
    .orbit-dot span {
      position: absolute;
      top: -6px;
      left: 50%;
      width: 12px;
      height: 12px;
      margin-left: -6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
    .orbit-dot.reverse span { background: var(--accent2); box-shadow: 0 0 12px var(--accent2); }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      padding: 0.35rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(110, 168, 255, 0.08);
    }

    h1 {
      margin: 1rem 0 0.5rem;
      font-size: clamp(1.9rem, 6vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(90deg, var(--content), var(--accent), var(--accent2), var(--content));
      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }

    @keyframes shine { to { background-position: 250% center; } }

    .sub { color: var(--muted); font-size: 1.05rem; line-height: 1.6; margin: 0.25rem auto 0; max-width: 42ch; }

    /* Animated progress bar */
    .progress {
      margin: 2rem auto 0.5rem;
      width: min(80%, 360px);
      height: 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .progress .fill {
      height: 100%;
      width: 40%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      background-size: 200% 100%;
      animation: load 2.6s ease-in-out infinite, slide 2s linear infinite;
    }

    @keyframes load {
      0%   { width: 8%;  margin-left: 0%; }
      50%  { width: 55%; margin-left: 20%; }
      100% { width: 8%;  margin-left: 92%; }
    }
    @keyframes slide { to { background-position: 200% 0; } }

    .status {
      margin-top: 0.75rem;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.04em;
    }
    .status .dots::after {
      content: "";
      animation: dots 1.6s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: ""; }
      25%  { content: "."; }
      50%  { content: ".."; }
      75%  { content: "..."; }
      100% { content: ""; }
    }

    .links {
      margin-top: 2rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      justify-content: center;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1.1rem;
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
      color: var(--content);
      border: 1px solid var(--border);
      border-radius: 10px;
      transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    .links a:hover {
      transform: translateY(-2px);
      background: rgba(110, 168, 255, 0.12);
      color: var(--accent);
    }
    .links a.primary {
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: var(--accent-contrast);
      border-color: transparent;
      font-weight: 600;
    }

    footer {
      position: fixed;
      bottom: 1rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      z-index: 2;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

</html>
